---
- name: Deploy Helm Chart to Kubernetes
  hosts: master-node
  become: true
  vars:
    chart_remote_dir: "/opt/diplom_chart"
    chart_remote_dir_caddy: "/opt/Caddyfile"
    k8s_namespace: "default"
    helm_release_name: "my-diplom-app"

  tasks:
    - name: Create remote directory for Helm chart
      ansible.builtin.file:
        path: "{{ chart_remote_dir }}"
        state: directory
        mode: '0755'

    - name: Create remote directory for configmap caddy-config
      ansible.builtin.file:
        path: "{{ chart_remote_dir_caddy }}"
        state: directory
        mode: '0755'

    - name: Copy Helm chart from GitHub Runner to Master Node
      ansible.builtin.copy:
        src: "../Helm_go/"  
        dest: "{{ chart_remote_dir }}/"
        mode: '0644'
    
    - name: Copy configmap caddy-config from GitHub Runner to Master Node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../Caddy/Caddyfile"
        dest: "{{ chart_remote_dir_caddy }}/Caddyfile"
        mode: '0644'

    - name: Create or update Caddy ConfigMap
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create configmap caddy-config \
          --from-file=Caddyfile=/opt/Caddyfile/Caddyfile \
          --namespace {{ k8s_namespace | quote }} \
          --dry-run=client -o yaml |
        kubectl apply --namespace {{ k8s_namespace | quote }} -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /home/admin/.kube/config
      register: configmap_output
      changed_when: >
        'created' in configmap_output.stdout or
        'configured' in configmap_output.stdout

    - name: Install or Upgrade Helm Release
      ansible.builtin.shell: |
        helm upgrade --install {{ helm_release_name }} {{ chart_remote_dir }} \
          --namespace {{ k8s_namespace }}
      register: helm_output
      changed_when: true

    - name: Show Helm deploy output
      ansible.builtin.debug:
        var: helm_output.stdout_lines
    
    - name: Show ConfigMap output
      ansible.builtin.debug:
        var: configmap_output.stdout_lines


