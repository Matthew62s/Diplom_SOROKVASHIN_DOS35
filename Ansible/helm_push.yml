---
- name: Deploy Helm Chart to Kubernetes
  hosts: master-node
  become: true
  vars:
    chart_remote_dir: "/opt/diplom_chart"
    chart_remote_dir_caddy: "/opt/Caddyfile"
    k8s_namespace: "default"
    helm_release_name: "my-diplom-app"

  tasks:
    - name: Create remote directory for Helm chart
      ansible.builtin.file:
        path: "{{ chart_remote_dir }}"
        state: directory
        mode: "0755"

    - name: Create remote directory for configmap caddy-config
      ansible.builtin.file:
        path: "{{ chart_remote_dir_caddy }}"
        state: directory
        mode: "0755"

    - name: Copy Helm chart from GitHub Runner to Master Node
      ansible.builtin.copy:
        src: "../Helm_go/"
        dest: "{{ chart_remote_dir }}/"
        mode: "0644"

    - name: Install or Upgrade Helm Release
      ansible.builtin.shell: |
        helm upgrade --install {{ helm_release_name }} {{ chart_remote_dir }} \
          --namespace {{ k8s_namespace }}
      register: helm_output
      changed_when: true

    - name: Show Helm deploy output
      ansible.builtin.debug:
        var: helm_output.stdout_lines

    - name: Create certificate directory on worker-node-1
      ansible.builtin.file:
        path: /var/lib/traefik
        state: directory
        owner: "65532"
        group: "65532"
        mode: "0700"
      delegate_to: worker-node-1

    - name: Create Traefik storage manifest
      ansible.builtin.copy:
        dest: /opt/traefik-storage.yaml
        mode: "0644"
        content: |
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: traefik-certs-pv
          spec:
            capacity:
              storage: 128Mi
            volumeMode: Filesystem
            accessModes:
              - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            claimRef:
              namespace: default
              name: traefik-certs-storage
            hostPath:
              path: /var/lib/traefik
              type: Directory
            nodeAffinity:
              required:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - worker-node-1
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: traefik-certs-storage
            namespace: default
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: ""
            volumeName: traefik-certs-pv
            resources:
              requests:
                storage: 128Mi

    - name: Apply Traefik storage
      ansible.builtin.command:
        cmd: kubectl apply -f /opt/traefik-storage.yaml
      environment:
        KUBECONFIG: /home/admin/.kube/config

    - name: Create values.yaml for traefik
      ansible.builtin.copy:
        dest: /opt/traefik-values.yaml
        mode: "0644"
        content: |
          deployment:
            enabled: true
            kind: Deployment
            replicas: 1

          updateStrategy:
            type: Recreate
            rollingUpdate: {}

          autoscaling:
            enabled: false

          nodeSelector:
            kubernetes.io/hostname: worker-node-1

          hostNetwork: false

          service:
            type: ClusterIP
            spec:
              type: ClusterIP

          ports:
            web:
              port: 8000
              exposedPort: 80
              hostPort: 80
            websecure:
              port: 8443
              exposedPort: 443
              hostPort: 443

          persistence:
            enabled: true
            name: traefik-certs-storage
            existingClaim: traefik-certs-storage
            size: 128Mi
            path: /data

          additionalArguments:
            - "--certificatesresolvers.le.acme.email=vtsfut76@gmail.com"
            - "--certificatesresolvers.le.acme.storage=/data/acme.json"
            - "--certificatesresolvers.le.acme.httpchallenge=true"
            - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
            - "--entrypoints.web.http.redirections.entrypoint.to=:443"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

          ingressClass:
            enabled: true
            name: traefik
            isDefaultClass: false

          providers:
            kubernetesIngress:
              enabled: true
            kubernetesCRD:
              enabled: true
            kubernetesGateway:
              enabled: false

          gateway:
            enabled: false

          ingressRoute:
            dashboard:
              enabled: false

    - name: Install or upgrade Traefik
      ansible.builtin.shell: |
        set -euo pipefail
        helm repo add traefik https://traefik.github.io/charts
        helm repo update
        helm upgrade --install traefik traefik/traefik \
          --namespace default \
          --reset-values \
          --values /opt/traefik-values.yaml \
          --wait \
          --timeout 5m
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /home/admin/.kube/config
      changed_when: true

    - name: Show ConfigMap output
      ansible.builtin.debug:
        var: configmap_output.stdout_lines
