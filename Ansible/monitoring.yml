---
- name: Deploy monitoring to Kubernetes
  hosts: master-node
  become: true
  vars:
    grafana_admin_password: >-
      {{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}
    val_path: "/opt/monitoring"

  tasks:
    - name: Create or update grafana credentials secret
      ansible.builtin.shell: |
        kubectl create secret generic grafana-admin \
          --namespace monitoring \
        --from-literal=admin-user=admin \
        --from-file=admin-password={{ grafana_admin_password }}

      register: secret_output
      changed_when: "'configured' in secret_output.stdout or 'created' in secret_output.stdout"

    - name: Create remote directory for monitoring
      ansible.builtin.file:
        path: "{{ val_path }}"
        state: directory
        mode: "0755"

    - name: Copy Helm chart from GitHub Runner to Master Node
      ansible.builtin.copy:
        src: "../Monitoring/"
        dest: "{{ val_path }}/"
        mode: "0644"

    - name: Install or Upgrade Helm Release
      ansible.builtin.shell: |
        helm upgrade --install monitoring \
          prometheus-community/kube-prometheus-stack \
          --version 92.10.1 \
          -n monitoring \
          -f ~/monitoring/values.yaml \
          --wait --timeout 10m
      register: helm_output
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /home/admin/.kube/config
      changed_when: true

    - name: Show Helm deploy output
      ansible.builtin.debug:
        var: helm_output.stdout_lines
