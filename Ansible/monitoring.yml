---
- name: Deploy monitoring to Kubernetes
  hosts: master-node
  become: true
  vars:
    telegram_bot_token: >-
      {{ lookup('ansible.builtin.env', 'TELEGRAM_BOT_TOKEN') }}
    grafana_admin_password: >-
      {{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}
    val_path: "/opt/monitoring"

  environment:
    KUBECONFIG: /home/admin/.kube/config

  tasks:
    - name: Check Grafana password
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
        fail_msg: "GRAFANA_ADMIN_PASSWORD is required"
      no_log: true

    - name: Create monitoring namespace
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create namespace monitoring \
          --dry-run=client -o yaml |
        kubectl apply -f -
      args:
        executable: /bin/bash
      register: namespace_output
      changed_when: "'created' in namespace_output.stdout"

    - name: Create or update grafana credentials secret
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create secret generic grafana-admin \
          --namespace monitoring \
          --from-literal=admin-user=admin \
          --from-file=admin-password=/dev/stdin \
          --dry-run=client -o yaml |
        kubectl apply -f -
      args:
        executable: /bin/bash
        stdin: "{{ grafana_admin_password }}"
        stdin_add_newline: false
      register: secret_output
      changed_when: >-
        'configured' in secret_output.stdout or
        'created' in secret_output.stdout
      no_log: true
    
    - name: Check Telegram token
      ansible.builtin.assert:
        that:
          - telegram_bot_token | length > 0
        fail_msg: "TELEGRAM_BOT_TOKEN is required"
      no_log: true

    - name: Create or update Telegram secret
      ansible.builtin.shell: |
        set -o pipefail
        kubectl create secret generic telegram-bot \
          --namespace monitoring \
          --from-file=token=/dev/stdin \
          --dry-run=client -o yaml |
        kubectl apply -f -
      args:
        executable: /bin/bash
        stdin: "{{ telegram_bot_token }}"
        stdin_add_newline: false
      register: telegram_secret_output
      changed_when: >-
        'created' in telegram_secret_output.stdout or
        'configured' in telegram_secret_output.stdout
      no_log: true

    - name: Create remote directory for monitoring
      ansible.builtin.file:
        path: "{{ val_path }}"
        state: directory
        mode: "0755"

    - name: Copy monitoring values from GitHub Runner to Master Node
      ansible.builtin.copy:
        src: "../Monitoring/"
        dest: "{{ val_path }}/"
        mode: "0644"

    - name: Add Helm repository
      ansible.builtin.shell: |
        set -euo pipefail
        helm repo add prometheus-community \
          https://prometheus-community.github.io/helm-charts \
          --force-update
        helm repo update prometheus-community
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install or Upgrade Helm Release
      ansible.builtin.shell: |
        helm upgrade --install monitoring \
          prometheus-community/kube-prometheus-stack \
          --version 92.10.1 \
          -n monitoring \
          -f "{{ val_path }}/values.yaml" \
          --wait --timeout 10m
      register: helm_output
      args:
        executable: /bin/bash
      changed_when: true
    
    - name: Apply Go application alerts
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ val_path }}/goapp-alerts.yaml"
      register: alerts_output
      changed_when: >-
        'created' in alerts_output.stdout or
        'configured' in alerts_output.stdout

    - name: Show Helm deploy output
      ansible.builtin.debug:
        var: helm_output.stdout_lines