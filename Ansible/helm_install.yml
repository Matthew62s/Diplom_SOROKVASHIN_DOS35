---
- name: Install helm for master-node
  hosts: master-node
  become: true

  tasks:
    - name: Download Helm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0700"

    - name: Install Helm
      ansible.builtin.command:
        cmd: /tmp/get_helm.sh
      changed_when: true

    - name: Helm version
      ansible.builtin.command:
        cmd: helm version
      changed_when: true
