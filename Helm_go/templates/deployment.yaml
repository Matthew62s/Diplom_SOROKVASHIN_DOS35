apiVersion: apps/v1
kind: Deployment
metadata:
  name: goapp
  labels:
    app: goapp
spec:
  # HPA manages replicas; the initial minimum is set in hpa.yaml.
  selector:
    matchLabels:
      app: goapp
  template:
    metadata:
      labels:
        app: goapp
    spec:
      serviceAccountName: goapp
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: goapp
          image: ghcr.io/matthew62s/diplom_sorokvashin_dos35:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http

        - name: caddy
          image: caddy:2
          imagePullPolicy: IfNotPresent
          command: ["caddy"]
          args:
            - run
            - --config
            - /opt/pvc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: caddy-http
              containerPort: 80
              protocol: TCP
            - name: caddy-https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /opt/pvc/caddy
              readOnly: true
            - name: caddy-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
          livenessProbe:
            tcpSocket:
              port: caddy-https
          readinessProbe:
            tcpSocket:
              port: caddy-https

      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-storage
          persistentVolumeClaim:
            claimName: caddy-storage
