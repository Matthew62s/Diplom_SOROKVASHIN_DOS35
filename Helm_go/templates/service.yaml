apiVersion: v1
kind: Service
metadata:
  name: goapp
  labels:
    app: goapp
spec:
  type: NodePort
  selector:
    app: goapp
  ports:
    - name: http
      port: 80
      targetPort: caddy-http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: caddy-https
      nodePort: 30443
