{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goapp
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: goapp

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}

  targetLabels:
    - app

  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}