name: 'Setup'

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Start the deploy"
        required: true
        type: boolean
        default: false
        
permissions:
  contents: read

jobs:
  terraform:
    name: 'Run Ansible Playbook'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Install the latest version of Ansible to git runner
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
          python-version: '3.12'

    - name: Install Ansible
      run: |
          python -m pip install --upgrade pip
          pip install ansible

    - name: Run Playbook
      run: |
          ansible --version

    - name: SSH Agent
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Create inventory
      if: ${{ inputs.apply }}
      run: |
        mkdir -p inventory/cluster
        touch inventory/cluster/inventory.ini
        cat << EOF > inventory/cluster/inventory.ini
        [all]
        master-node ansible_host="${{ vars.MASTER_NODE_IP }}"
        worker-node-1 ansible_host="${{ vars.WORKER_NODE1_IP }}"
        worker-node-2 ansible_host="${{ vars.WORKER_NODE2_IP }}"

        [all:vars]
        ansible_user=admin
        
        [kube-master]
        master-node

        [etcd]
        master-node

        [kube-node]
        worker-node-1
        worker-node-2

        [calico-rr]

        [k8s-cluster:children]
        kube-master
        kube-node
        calico-rr
        EOF

    - name: Setup ghcr registry
      if: ${{ inputs.apply }}
      env:
        K8S_USER: ${{ github.actor }}
        K8S_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        mkdir -p secrets/playbooks/
        touch secrets/playbooks/ghcr.yml
        cat << EOF > secrets/playbooks/ghcr.yml
        ---

        - name: Create ghcr credentials
          hosts: master-node
          become: true

          tasks:
            - name: Create or update ghcr credentials secret
              ansible.builtin.shell: |
                kubectl create secret docker-registry ghcr-cred \
                  --docker-server=ghcr.io \
                  --docker-username="{{ k8s_user }}" \
                  --docker-password="{{ k8s_token }}" \
                  --dry-run=client -o yaml | kubectl apply -f -
              register: secret_output
              changed_when: "'configured' in secret_output.stdout or 'created' in secret_output.stdout"

        EOF

        export ANSIBLE_HOST_KEY_CHECKING=False
        ansible all -m ping -i inventory/cluster/inventory.ini
        ansible-playbook -i inventory/cluster/inventory.ini ./Ansible/add_config_k8s.yml --limit master-node
        ansible-playbook -i inventory/cluster/inventory.ini ./Ansible/helm_install.yml --limit master-node
        ansible-playbook -i inventory/cluster/inventory.ini secrets/playbooks/ghcr.yml \
          --limit master-node \
          -e "k8s_user=${K8S_USER} k8s_token=${K8S_TOKEN}"
        ansible-playbook -i inventory/cluster/inventory.ini ./Ansible/helm_push.yml --limit master-node
