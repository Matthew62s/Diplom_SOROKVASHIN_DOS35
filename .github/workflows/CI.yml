name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write

    outputs:
      image_tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go application
        run: go test -mod=readonly -race -coverprofile="$RUNNER_TEMP/coverage.out" -v ./...

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
          
      - name: Validate Helm chart
        run: |
          helm lint Helm_go
          helm template my-diplom-app Helm_go \
            --namespace default \
            --set serviceMonitor.enabled=true \
            > /tmp/goapp-rendered.yaml

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: "false"
          VALIDATE_JSCPD: "false"
          VALIDATE_JSON_PRETTIER: "false"
          VALIDATE_YAML_PRETTIER: "false"
          TRIVY_SKIP_DIRS: "Terraform,Helm_go/templates"
          FILTER_REGEX_EXCLUDE: '(^|/)Helm_go/templates/'
          KUBERNETES_KUBECONFORM_OPTIONS: >-
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

      - name: Calculate next version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print; exit}')

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Next version: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        env:
          IMAGE_ID: ${{ steps.build-image.outputs.imageid }}
        run: bash tests/smoke.sh "$IMAGE_ID"

      - name: Publish tested Docker image
        id: build-and-push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
          repo_digest=$(docker image inspect "${tags[0]}" \
            --format '{{index .RepoDigests 0}}')
          digest="${repo_digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      - name: Push Git version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          gh auth setup-git
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

  deploy:
    name: Deploy application
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    env:
      MASTER_NODE_IP: ${{ vars.MASTER_NODE_IP }}
      WORKER_NODE1_IP: ${{ vars.WORKER_NODE1_IP }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      ANSIBLE_HOST_KEY_CHECKING: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create inventory
        run: |
          mkdir -p inventory
          cat > inventory/deploy.ini <<EOF
          [app]
          master-node ansible_host=${MASTER_NODE_IP} ansible_user=admin
          worker-node-1 ansible_host="${WORKER_NODE1_IP}" ansible_user=admin
          EOF

      - name: Helm push
        run: |
          ansible-playbook \
            -i inventory/deploy.ini \
            Ansible/helm_push.yml \
            --limit master-node
        
      - name: Deploy application through Ansible
        run: |
          ansible-playbook \
            -i inventory/deploy.ini \
            Ansible/deploy_app.yml \
            --extra-vars "image_tag=${IMAGE_TAG}"
      
      - name: Monitoring deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          ansible-playbook \
            -i inventory/deploy.ini \
            Ansible/monitoring.yml \
            --limit master-node
