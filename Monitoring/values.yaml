grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false
  
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1024Mi

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: le
    hosts:
      - grafana.oohjob.com
    path: /
    pathType: Prefix

  grafana.ini:
    server:
      domain: grafana.oohjob.com
      root_url: https://grafana.oohjob.com

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    retention: 2d
    retentionSize: 2GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true