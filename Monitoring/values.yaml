grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    enabled: false
  
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1024Mi

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: le
    hosts:
      - grafana.oohjob.com
    path: /
    pathType: Prefix

  grafana.ini:
    server:
      domain: grafana.oohjob.com
      root_url: https://grafana.oohjob.com

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    serviceMonitorSelector:
      matchLabels:
        release: monitoring

    serviceMonitorNamespaceSelector: {}

    retention: 2d
    retentionSize: 2GB

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - telegram-bot

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - receiver: telegram
          matchers:
            - 'namespace="default"'
            - 'alertname=~"GoApp.*"'

    receivers:
      - name: "null"

      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot/token
            chat_id: -5304492924
            send_resolved: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true