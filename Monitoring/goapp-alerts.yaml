apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: goapp-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: goapp
      rules:
        - alert: GoAppNoAvailableReplicas
          expr: |
            kube_deployment_status_replicas_available{
              namespace="default",
              deployment="goapp"
            } == 0
          for: 2m
          labels:
            severity: critical
            namespace: default
          annotations:
            summary: "No Go application replicas available"

        - alert: GoAppMetricsUnavailable
          expr: |
            up{namespace="default", app="goapp"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Failed to collect Go application metrics"

        - alert: GoAppHighErrorRate
          expr: |
            (
              sum(rate(goapp_http_requests_total{
                namespace="default",
                app="goapp",
                code=~"5.."
              }[5m]))
              /
              clamp_min(
                sum(rate(goapp_http_requests_total{
                  namespace="default",
                  app="goapp"
                }[5m])),
                0.001
              )
            ) > 0.05
            and
            sum(increase(goapp_http_requests_total{
              namespace="default",
              app="goapp"
            }[5m])) >= 100
          for: 5m
          labels:
            severity: warning
            namespace: default
          annotations:
            summary: "More than 5% of HTTP responses are 5xx"